<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anslem David | AI & IT Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#f6f8fa;
      color:#0f172a;
      transition:0.3s;
      overflow-x:hidden;
    }

    body.dark{
      background:#0d1117;
      color:#e6edf3;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      width:min(1100px,95%);
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.4);
      border-radius:28px;
      padding:14px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:1000;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    body.dark .navbar{
      background:rgba(22,27,34,0.88);
      border-color:#30363d;
    }

    .logo{
      font-size:1.7rem;
      font-weight:700;
    }

    .nav-right{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .icon{
      width:44px;
      height:44px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #d0d7de;
      cursor:pointer;
      transition:0.25s;
      background:white;
    }

    .icon:hover{
      transform:translateY(-2px);
    }

    body.dark .icon{
      background:#161b22;
      border-color:#30363d;
    }

    /* HERO */
    .hero{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding-top:120px;
    }

    .badge{
      background:#dcfce7;
      color:#166534;
      padding:10px 18px;
      border-radius:999px;
      font-weight:600;
      margin-bottom:24px;
    }

    body.dark .badge{
      background:#163025;
      color:#7ee787;
    }

    h1{
      font-size:clamp(2.8rem,7vw,5.8rem);
      line-height:1.05;
      font-weight:800;
      margin-bottom:18px;
      letter-spacing:-2px;
    }

    .gradient{
      background:linear-gradient(135deg,#16a34a,#0ea5e9);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      max-width:820px;
      font-size:1.25rem;
      line-height:1.8;
      color:#475467;
      margin-bottom:38px;
    }

    body.dark .subtitle{
      color:#9fb0c3;
    }

    .buttons{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .btn{
      padding:16px 30px;
      border-radius:18px;
      text-decoration:none;
      font-weight:600;
      transition:0.25s;
    }

    .btn-primary{
      background:#16a34a;
      color:white;
      box-shadow:0 10px 25px rgba(22,163,74,0.25);
    }

    .btn-primary:hover{
      transform:translateY(-3px);
    }

    .btn-secondary{
      border:2px solid #16a34a;
      color:#16a34a;
      background:transparent;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:22px;
      margin:90px 0;
    }

    .card{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:24px;
      padding:28px;
      text-align:center;
      transition:0.25s;
    }

    .card:hover{
      transform:translateY(-6px);
    }

    body.dark .card{
      background:#161b22;
      border-color:#30363d;
    }

    .number{
      font-size:3rem;
      font-weight:800;
      color:#16a34a;
    }

    .label{
      margin-top:10px;
      color:#667085;
      font-weight:500;
    }

    body.dark .label{
      color:#9fb0c3;
    }

    /* GITHUB */
    .github{
      margin:80px 0;
      text-align:center;
    }

    .github img{
      width:100%;
      max-width:900px;
      border-radius:22px;
      box-shadow:0 20px 40px rgba(0,0,0,0.12);
    }

    /* ABOUT */
    .about{
      display:grid;
      grid-template-columns:1.1fr 1fr;
      gap:36px;
      align-items:center;
      margin:100px 0;
    }

    .about-box{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:28px;
      padding:34px;
    }

    body.dark .about-box{
      background:#161b22;
      border-color:#30363d;
    }

    .section-title{
      font-size:2rem;
      margin-bottom:18px;
      font-weight:700;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:20px;
    }

    .skill{
      padding:10px 16px;
      background:#ecfdf5;
      color:#166534;
      border-radius:999px;
      font-weight:600;
    }

    body.dark .skill{
      background:#163025;
      color:#7ee787;
    }

    /* FOOTER */
    footer{
      text-align:center;
      padding:50px 20px;
      color:#667085;
    }

    body.dark footer{
      color:#8b949e;
    }

    @media (max-width:900px){
      .about{
        grid-template-columns:1fr;
      }

      .navbar{
        padding:12px 18px;
      }

      .logo{
        font-size:1.4rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">Anslem David</div>

    <div class="nav-right">
      <a class="icon" href="https://github.com/anslemdavid" target="_blank">🐙</a>
      <a class="icon" href="https://linkedin.com" target="_blank">💼</a>
      <div class="icon" onclick="toggleTheme()">🌙</div>
    </div>
  </nav>

  <div class="container">

    <section class="hero">
      <div class="badge">🚀 Available for IT & AI Opportunities</div>

      <h1>
        AI • IT • <span class="gradient">System Integration</span>
      </h1>

      <p class="subtitle">
        I build intelligent, scalable digital solutions that combine networking,
        cybersecurity, automation, data analysis, and modern web technologies.
        Passionate about turning complex technical problems into practical,
        user-focused solutions.
      </p>

      <div class="buttons">
        <a href="#github" class="btn btn-primary">View My Work</a>
        <a href="mailto:your@email.com" class="btn btn-secondary">Let's Connect</a>
      </div>
    </section>

    <section class="stats">
      <div class="card">
        <div class="number">30+</div>
        <div class="label">Projects Completed</div>
      </div>

      <div class="card">
        <div class="number">10+</div>
        <div class="label">Technical Certificates</div>
      </div>

      <div class="card">
        <div class="number">24/7</div>
        <div class="label">Learning & Innovation</div>
      </div>
    </section>

    <section class="about">
      <div class="about-box">
        <h2 class="section-title">About Me</h2>
        <p style="line-height:1.8">
          I'm Anslem David Musedde, an aspiring IT professional in Germany with
          a strong interest in System Integration, Networking, Cybersecurity,
          Cloud Technologies, and AI-powered applications. My goal is to become
          a highly skilled Fachinformatiker and contribute to innovative
          technology projects.
        </p>

        <div class="skills">
          <span class="skill">CCNA</span>
          <span class="skill">Cybersecurity</span>
          <span class="skill">Linux</span>
          <span class="skill">Networking</span>
          <span class="skill">SQL</span>
          <span class="skill">Python</span>
          <span class="skill">Web Development</span>
        </div>
      </div>

      <div class="about-box" style="text-align:center">
        <img
          src="https://github-readme-stats.vercel.app/api?username=anslemdavid&show_icons=true&theme=tokyonight&hide_border=true"
          alt="GitHub Stats"
          style="width:100%;border-radius:18px;"
        >
      </div>
    </section>

    <section id="github" class="github">
      <h2 class="section-title">GitHub Activity</h2>
      <img
        src="https://github-readme-activity-graph.vercel.app/graph?username=anslemdavid&theme=tokyo-night&hide_border=true"
        alt="GitHub Activity Graph"
      >
    </section>

  </div>

  <footer>
    © 2026 Anslem David Musedde • Built with HTML, CSS & GitHub Pages
  </footer>

  <script>
    function toggleTheme(){
      document.body.classList.toggle('dark');
      localStorage.setItem('theme',
        document.body.classList.contains('dark') ? 'dark' : 'light'
      );
    }

    if(localStorage.getItem('theme') === 'dark'){
      document.body.classList.add('dark');
    }
  </script>

</body>
</html>
